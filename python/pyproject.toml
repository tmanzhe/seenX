[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seenx"
version = "0.1.0"
description = "Local text and visual retrieval prototype for seenX"
requires-python = ">=3.13"
dependencies = ["Pillow>=13.0,<14", "pypdf>=6,<7"]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
ocr = ["pyobjc-framework-Vision>=11,<13; sys_platform == 'darwin'"]
visual = ["torch>=2.6,<3", "transformers>=5.10,<6"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
seenx-inspect = "seenx.load_images:main"
seenx-visual = "seenx.visual_search:main"
seenx-search = "seenx.search_files:main"
seenx-eval = "seenx.retrieval_eval:main"
seenx-memory = "seenx.memory_cli:main"
seenx-engine = "seenx.engine_stdio:main"
seenx-mcp = "seenx.mcp_stdio:main"

[tool.setuptools.packages.find]
where = ["src"]
