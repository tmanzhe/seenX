[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seenx"
version = "0.1.0"
description = "Local text and visual retrieval prototype for seenX"
requires-python = ">=3.13"
dependencies = ["Pillow>=12.0,<13", "pypdf>=6,<7"]

[project.optional-dependencies]
ocr = ["pyobjc-framework-Vision>=11,<13; sys_platform == 'darwin'"]
visual = ["torch>=2.6,<3", "transformers>=4.50,<5"]

[project.scripts]
seenx-inspect = "seenx.load_images:main"
seenx-visual = "seenx.visual_search:main"
seenx-search = "seenx.search_files:main"
seenx-memory = "seenx.memory_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
