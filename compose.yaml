services:
  web:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${SEENX_PORT:-8080}:8080"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    pids_limit: 128
    mem_limit: 128m
    cpus: 1
