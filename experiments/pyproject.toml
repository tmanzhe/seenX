[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seenx-experiments"
version = "0.1.0"
description = "Python learning and retrieval proofs of concept for seenX"
requires-python = ">=3.13"
dependencies = ["Pillow>=12.0,<13", "pypdf>=6,<7"]

[project.optional-dependencies]
ocr = ["pyobjc-framework-Vision>=11,<13; sys_platform == 'darwin'"]
visual = ["torch>=2.6,<3", "transformers>=4.50,<5"]

[tool.setuptools]
py-modules = ["load_images", "image_ocr", "record_cache", "visual_search", "search_files"]

[tool.uv]
package = false
