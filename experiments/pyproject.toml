[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seenx-experiments"
version = "0.1.0"
description = "Python learning and retrieval proofs of concept for seenX"
requires-python = ">=3.13"
dependencies = ["Pillow>=12.0,<13", "pypdf>=6,<7"]

[tool.setuptools]
py-modules = ["load_images"]

[tool.uv]
package = false
