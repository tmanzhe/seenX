# Keep these aligned with vercel.json; npm run check:config verifies parity.
# Static Next.js hydration uses inline scripts. This CSP deliberately limits
# embedding, plugins, base URLs, and forms without breaking hydration.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
